<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fiscal Data Toolkit — U.S. Macro Dashboard</title>
<style>
  :root { --bg:#0b0e14; --card:#151a23; --line:#222b39; --txt:#e6edf3; --dim:#8b98a9;
          --green:#3fb950; --red:#f85149; --blue:#58a6ff; --accent:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { padding:24px 28px 8px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  .sub { color:var(--dim); font-size:12px; margin-top:4px; }
  main { padding:24px 28px; max-width:1200px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; position:relative; }
  .spark { position:absolute; top:16px; right:18px; opacity:.9; }
  .stock .spark { position:static; }
  .scroll { overflow-x:auto; }
  .card h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); }
  .row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #1c2430; }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--dim); }
  .row .v { font-weight:600; }
  .big { font-size:26px; font-weight:700; margin:2px 0 10px; }
  .neg { color:var(--red); } .pos { color:var(--green); } .blue { color:var(--blue); }
  .note { color:var(--dim); font-size:11px; margin-top:10px; }
  section.stock { margin-top:28px; }
  .search { display:flex; gap:8px; margin-bottom:16px; }
  .search input { flex:0 0 200px; background:var(--card); border:1px solid var(--line);
                  color:var(--txt); padding:10px 12px; border-radius:8px; font:inherit; text-transform:uppercase; }
  .search button { background:var(--blue); color:#04101f; border:0; padding:10px 18px;
                   border-radius:8px; font:inherit; font-weight:700; cursor:pointer; }
  .search button:disabled { opacity:.5; cursor:wait; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th,td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:600; font-size:12px; }
  .val-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:14px; }
  .val { background:#0e131b; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .val .l { color:var(--dim); font-size:11px; } .val .n { font-size:18px; font-weight:700; }
  .err { color:var(--red); margin-top:10px; }
  footer { color:var(--dim); font-size:11px; padding:16px 28px 28px; max-width:1200px; margin:0 auto; }
  a { color:var(--blue); }
</style>
</head>
<body>
<header>
  <h1>📊 U.S. Macro Dashboard</h1>
  <div class="sub">Live from Treasury · BEA/FRED · FDIC · SEC EDGAR — no API keys · <span id="ts"></span></div>
</header>
<main>
  <div class="grid" id="cards"><div class="card">Loading live data…</div></div>

  <section class="stock">
    <h2 style="color:var(--accent);font-size:12px;letter-spacing:1px;">COMPANY LOOKUP</h2>
    <div class="search">
      <input id="ticker" placeholder="e.g. NVDA" value="NVDA" />
      <button id="go">Look up</button>
    </div>
    <div id="stock"></div>
  </section>
</main>
<footer>
  Data: official U.S. government APIs + Yahoo Finance. Education/research only — not financial advice.
  Built with the <a href="https://github.com/Heavens-Lava/fiscal-data-toolkit">fiscal-data-toolkit</a>.
</footer>

<script>
const T = (n) => { if (n==null) return "–"; const a=Math.abs(n), s=n<0?"-":"";
  return a>=1e12?`${s}$${(a/1e12).toFixed(2)}T`: a>=1e9?`${s}$${(a/1e9).toFixed(1)}B`:
         a>=1e6?`${s}$${(a/1e6).toFixed(1)}M`:`${s}$${a.toFixed(0)}`; };
const P = (n) => n==null?"–":`${(n*100).toFixed(1)}%`;
const X = (n) => n==null?"–":`${n.toFixed(1)}x`;
const sign = (n) => n<0?"neg":"pos";

function row(k,v,cls=""){ return `<div class="row"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`; }

// Inline SVG sparkline (line) — no library.
function spark(vals, color, w=150, h=36){
  vals = (vals||[]).filter(v=>Number.isFinite(v));
  if(vals.length<2) return "";
  const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-min)/rng)*(h-4)-2).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/></svg>`;
}
// Inline SVG bars (for revenue).
function bars(vals, color, w=150, h=36){
  vals = (vals||[]).filter(v=>Number.isFinite(v));
  if(!vals.length) return "";
  const max=Math.max(...vals.map(Math.abs))||1, bw=w/vals.length;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+
    vals.map((v,i)=>{const bh=Math.abs(v)/max*(h-4);return `<rect x="${(i*bw+1).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}"/>`;}).join("")+
  `</svg>`;
}

const errCard = (label, msg) => `<div class="card"><h2>${label}</h2><div class="err">⚠ ${msg}</div></div>`;

async function loadDash(){
  const d = await (await fetch("/api/dashboard")).json();
  document.getElementById("ts").textContent = "updated " + new Date().toLocaleString();
  const cards = [];

  if(d.fiscal.ok){ const f=d.fiscal.data; cards.push(`
    <div class="card">
      ${spark(f.debtHistory, "#f85149")}
      <h2>Government — FY${f.fy}</h2>
      <div class="big neg">${T(f.debt)}</div>
      <div class="note" style="margin-top:-8px">national debt ↗</div>
      ${row("Receipts (taxes)", T(f.receipts), "blue")}
      ${row("Outlays (spending)", T(f.outlays))}
      ${row("Deficit", T(f.deficit), "neg")}
      ${row("Interest so far", T(f.interestFytd), "neg")}
      <div class="note">Borrowing $${(f.deficit/f.outlays).toFixed(2)} of every $1 spent.</div>
    </div>`); } else cards.push(errCard("Government", d.fiscal.error));

  if(d.trade.ok){ const t=d.trade.data; cards.push(`
    <div class="card">
      ${spark(t.niipHistory, "#f85149")}
      <h2>Trade & World</h2>
      <div class="big neg">${T(t.niip)}</div>
      <div class="note" style="margin-top:-8px">net int'l investment position ↘</div>
      ${row("Current account /qtr", T(t.currentAccount), "neg")}
      ${row("% of GDP", P(t.caPctGdp/100), "neg")}
      ${row("Trade balance /mo", T(t.tradeBalance), "neg")}
      <div class="note">The world owns ${T(-t.niip)} more of the US than vice-versa.</div>
    </div>`); } else cards.push(errCard("Trade & World", d.trade.error));

  if(d.money.ok){ const m=d.money.data; cards.push(`
    <div class="card">
      ${spark(m.m2History, "#58a6ff")}
      <h2>Money</h2>
      <div class="big blue">${T(m.m2)}</div>
      <div class="note" style="margin-top:-8px">M2 money supply ↗</div>
      ${row("Cash in circulation", T(m.cash))}
      ${row("Printed 2020–21", T(m.printed2020_21), "neg")}
      ${row("…growth", "+"+m.printedPct.toFixed(0)+"%", "neg")}
      <div class="note">~40% of all dollars were created in two years.</div>
    </div>`); } else cards.push(errCard("Money", d.money.error));

  if(d.banking.ok){ const b=d.banking.data; cards.push(`
    <div class="card">
      ${spark(b.assetsHistory, "#3fb950")}
      <h2>Banks — ${b.quarter}</h2>
      <div class="big">${T(b.assets)}</div>
      <div class="note" style="margin-top:-8px">${b.banks.toLocaleString()} banks · total assets</div>
      ${row("Deposits", T(b.deposits))}
      ${row("Securities held", T(b.securities), "blue")}
      ${row("Equity cushion", T(b.equity)+" ("+P(b.equity/b.assets)+")")}
      <div class="note">Securities are mostly gov't debt — the 2023 SVB risk.</div>
    </div>`); } else cards.push(errCard("Banks", d.banking.error));

  document.getElementById("cards").innerHTML = cards.join("");
}

async function loadStock(){
  const tk = document.getElementById("ticker").value.trim().toUpperCase();
  if(!tk) return;
  const btn=document.getElementById("go"); btn.disabled=true; btn.textContent="…";
  const el=document.getElementById("stock"); el.innerHTML="";
  try{
    const s = await (await fetch("/api/stock?ticker="+encodeURIComponent(tk))).json();
    if(s.error) throw new Error(s.error);
    const rows = s.series.map(y=>`<tr>
      <td>${y.year}</td><td>${T(y.revenue)}</td>
      <td class="${y.revGrowth>=0?'pos':'neg'}">${P(y.revGrowth)}</td>
      <td>${P(y.grossMargin)}</td>
      <td class="${(y.netIncome??0)>=0?'pos':'neg'}">${T(y.netIncome)}</td>
      <td class="${(y.netMargin??0)>=0?'pos':'neg'}">${P(y.netMargin)}</td>
      <td>${T(y.ocf)}</td>
      <td class="${(y.fcf??0)>=0?'pos':'neg'}">${T(y.fcf)}</td></tr>`).join("");
    el.innerHTML = `
      <div class="card">
        <h2>${s.name} (${s.ticker})</h2>
        <div style="display:flex;gap:28px;flex-wrap:wrap;margin-bottom:6px">
          <div><div class="note" style="margin:0">Revenue (4yr)</div>${bars(s.series.map(y=>y.revenue), "#58a6ff", 180, 40)}</div>
          <div><div class="note" style="margin:0">Price (1yr)</div>${spark(s.priceHistory, "#3fb950", 180, 40)}</div>
        </div>
        <div class="scroll"><table>
          <tr><th>Year</th><th>Revenue</th><th>Growth</th><th>GrossMgn</th><th>NetIncome</th><th>NetMgn</th><th>OpCashFlow</th><th>FreeCashFlow</th></tr>
          ${rows}
          <tr style="font-weight:700"><td>TTM</td><td>${T(s.ttm.revenue)}</td><td>–</td><td>–</td>
            <td class="${(s.ttm.netIncome??0)>=0?'pos':'neg'}">${T(s.ttm.netIncome)}</td>
            <td class="${(s.ttm.netMargin??0)>=0?'pos':'neg'}">${P(s.ttm.netMargin)}</td>
            <td>${T(s.ttm.ocf)}</td>
            <td class="${(s.ttm.fcf??0)>=0?'pos':'neg'}">${T(s.ttm.fcf)}</td></tr>
        </table></div>
        <div class="val-grid">
          <div class="val"><div class="l">Price</div><div class="n">$${s.price?.toFixed(2)??"–"}</div></div>
          <div class="val"><div class="l">Market cap</div><div class="n">${T(s.marketCap)}</div></div>
          <div class="val"><div class="l">P / Sales</div><div class="n">${X(s.ps)}</div></div>
          <div class="val"><div class="l">P / Earnings</div><div class="n">${s.pe?X(s.pe):"n/a"}</div></div>
          <div class="val"><div class="l">P / Cash Flow</div><div class="n">${X(s.pcf)}</div></div>
          <div class="val"><div class="l">P / Free CF</div><div class="n">${s.pfcf?X(s.pfcf):"n/a"}</div></div>
        </div>
        <div class="note">Free Cash Flow = operating cash − capex. Negative FCF (Oracle-style) = burning cash on buildout despite "profits". High P/S, P/E, P/CF = priced for perfection.</div>
      </div>`;
  }catch(e){ el.innerHTML=`<div class="err">⚠ ${e.message}</div>`; }
  btn.disabled=false; btn.textContent="Look up";
}

document.getElementById("go").onclick = loadStock;
document.getElementById("ticker").addEventListener("keydown", e=>{ if(e.key==="Enter") loadStock(); });
loadDash().catch(e=>document.getElementById("cards").innerHTML=`<div class="card err">⚠ ${e.message}</div>`);
loadStock();
</script>
</body>
</html>
