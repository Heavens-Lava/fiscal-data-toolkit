                  - generic [ref=f11e480]:
                    - text: Overview
                    - paragraph [ref=f11e481]: Help build and operate the trusted platforms that power Microsoft 365's most critical compliance, security, and governance services. As a member of our team, you will work at the intersection of large-scale cloud engineering, service reliability, and operational excellence, helping ensure that enterprise and government customers can rely on Microsoft services every day. You'll collaborate with engineers across Microsoft to solve complex technical challenges, improve resiliency, and drive innovation through automation, modern cloud technologies, and data-driven operations.
                    - paragraph [ref=f11e482]: As a Site Reliability Engineer, you will help design, operate, and continuously improve large-scale Microsoft 365 and Purview services that support millions of users worldwide. You will partner with software engineers, service owners, and reliability teams to monitor service health, automate operational processes, investigate production issues, and implement engineering solutions that improve availability, performance, security, and customer experience.This opportunity will allow you to accelerate your cloud engineering expertise, develop deep knowledge of distributed systems and large-scale service operations, and build advanced skills in automation, observability, incident management, and AI-powered operational tooling. You will gain end-to-end ownership experience across the service lifecycle while helping shape the future of reliability engineering through automation, data-driven operations, and AI-enabled solutions.Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond.
                    - text: Responsibilities
                    - generic [ref=f11e483]: • You participate in onboarding, code/design reviews, and regular meetings with the engineering teams that develop and manage those products.
                    - paragraph [ref=f11e484]: • You independently develop code or scripts that automate the performance of repetitive and easily scalable operations processes.• You design, develop, and maintain telemetry pipelines and monitoring tools that detail operations metrics.• You develop, test, troubleshoot, and implement changes to optimize code and improve products.• You respond to incidents during regular on-call rotations.
                    - text: Qualifications
                    - table [ref=f11e485]:
                      - rowgroup [ref=f11e486]:
                        - row [ref=f11e487]:
                          - cell [ref=f11e488]:
                            - generic [ref=f11e490]:
                              - paragraph [ref=f11e491]:
                                - strong [ref=f11e492]: Required/Minimum Qualifications
                              - list [ref=f11e493]:
                                - listitem [ref=f11e494]: Bachelor's Degree in Computer Science or related technical field AND 2+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python OR equivalent experience.
                              - paragraph [ref=f11e495]:
                                - heading "Other Requirements:" [level=3] [ref=f11e496]
                              - paragraph [ref=f11e497]:
                                - strong [ref=f11e498]: "Security Clearance Requirements:"
                                - text: "Candidates must be able to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include, but are not limited to the following specialized security screenings:"
                              - list [ref=f11e499]:
                                - listitem [ref=f11e500]: The successful candidate must have an active U.S. Government Top Secret Clearance with access to Sensitive Compartmented Information (SCI) based on a Single Scope Background Investigation (SSBI). Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. Failure to maintain or obtain the appropriate U.S. Government clearance and/or customer screening requirements may result in employment action up to and including termination.
                                - listitem [ref=f11e501]:
                                  - strong [ref=f11e502]: Clearance Verification
                                  - text: ": This position requires successful verification of the stated security clearance to meet federal government customer requirements. You will be asked to provide clearance verification information prior to an offer of employment."
                                - listitem [ref=f11e503]:
                                  - strong [ref=f11e504]: "Microsoft Cloud Background Check:"
                                  - text: This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter.
                                - listitem [ref=f11e505]:
                                  - strong [ref=f11e506]: "Citizenship & Citizenship Verification:"
                                  - text: This position requires verification of U.S. citizenship due to citizenship-based legal restrictions. Specifically, this position supports United States federal, state, and/or local United States government agency customer and is subject to certain citizenship-based restrictions where required or permitted by applicable law. To meet this legal requirement, citizenship will be verified via a valid passport, or other approved documents, or verified US government Clearance
                              - paragraph [ref=f11e507]:
                                - strong [ref=f11e508]: Preferred/Additional Qualifications
                              - list [ref=f11e509]:
                                - listitem [ref=f11e510]: Master's Degree in Computer Science or related technical field AND 6+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python OR Bachelor's Degree in Computer Science or related technical field AND 8+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python OR equivalent experience.
                    - paragraph [ref=f11e511]: Site Reliability Engineering IC3 - The typical base pay range for this role across the U.S. is USD $102,100 - $202,200 per year. There is a different range applicable to specific work locations, within the San Francisco Bay area and New York City metropolitan area, and the base pay range for this role in those locations is USD $133,800 - $219,200 per year.
                    - paragraph
                    - paragraph [ref=f11e512]:
                      - text: "Certain roles may be eligible for benefits and other compensation. Find additional benefits and pay information here:"
