                      - generic [ref=f30e589]:
                        - generic [ref=f30e590]: Description
                        - textbox "Description" [ref=f30e593]: Support three production legislative websites (azhouse.gov, azsenate.gov, azleg.gov) - House and Senate sharing a nested theme, azleg.gov built and maintained separately - used daily by Arizona legislators and staff. Maintain structured data spanning bills, legislators, committees, votes, and calendars, piped from the Legislature's SQL Server database into reusable views shared across all three sites. Debug production issues by tracing the problem from what a user sees back to the underlying data, template, or query. Built out scenario-based regression testing across 15+ page templates, so edge cases get caught before non-technical legislative staff ever see them. Keep all three sites at WCAG AA accessibility compliance, and work directly with legislative staff to turn their workflow needs into real template and system changes. Also help maintain and build out the Legislature's broader suite of 100+ internal applications, including C# document-processing tools. Use AI-assisted workflows to move faster on implementation, testing, and debugging, but still own the code review and production quality at the end of it.
