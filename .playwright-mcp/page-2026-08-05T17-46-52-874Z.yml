          - heading "Full job description" [level=4] [ref=f98e159]
          - generic [ref=f98e278]:
            - text: "Overview:"
            - generic [ref=f98e279]: GovCIO is currently seeking React/Redux Frontend Developers to join a cross-functional team dedicated to delivering impactful features on VA.gov. This pivotal role will support achievement of development objectives across different customer products to ensure timely and efficient feature rollouts. This position is fully remote and available to candidates within the Continental United States (CONUS).
            - text: "Responsibilities:"
            - generic [ref=f98e280]: Develops and implements user interface components using React.js, Redux, and a comprehensive design system library, focusing on robust application integrations with REST/SOAP APIs and other established web services. Participates in system planning and the development deployment process while ensuring adherence to software compliance and testing standards. Responsible for overseeing the frontend development processes, creating user guidelines, and conducting system analysis to address questions regarding program intentions, output specifications, data input requirements, programming strategies, and control systems as needed.
            - paragraph [ref=f98e281]
            - list [ref=f98e282]:
              - listitem [ref=f98e283]: Work with a team of developers towards successful project execution, ensuring high-quality deliverables and timely completion.
              - listitem [ref=f98e284]: Provide mentorship and leadership, fostering a culture of continuous improvement and excellence within the team.
              - listitem [ref=f98e285]: Establish and promote best practices and coding standards to maintain high standards of excellence within the team.
              - listitem [ref=f98e286]: Collaborate on gathering user requirements, developing user stories, and planning project timelines and estimates.
              - listitem [ref=f98e287]: Oversee the preparation of comprehensive documentation, including reports, operational procedures, and maintenance manuals to ensure clear communication and record-keeping.
              - listitem [ref=f98e288]: Lead integration testing efforts to ensure seamless system functionality and robustness.
              - listitem [ref=f98e289]: Maintain proactive communication with both internal and external stakeholders to ensure alignment and address any project issues promptly.
              - listitem [ref=f98e290]: Conduct in-depth analysis of system requirements, including data flow, input/output specifications, and hardware/software needs to optimize system performance.
              - listitem [ref=f98e291]: Actively participate in code and sprint reviews, ensuring that all deliverables meet contractual obligations and project specifications.
            - text: "Qualifications:"
            - generic [ref=f98e292]: "Required Skills and Experience:"
            - list [ref=f98e293]:
              - listitem [ref=f98e294]: Bachelor's with 2-5 years (or commensurate experience)
              - listitem [ref=f98e295]: Demonstrated experience developing in React/Redux.
              - listitem [ref=f98e296]: Analytical and investigation skills.
              - listitem [ref=f98e297]: Ability to work independently with minimal guidance and supervision.
              - listitem [ref=f98e298]: Experience collaborating with a team of developers/engineers.
              - listitem [ref=f98e299]: Experience with Agile Methodology and Scrum Processes.
              - listitem [ref=f98e300]: Advanced knowledge of software development lifecycle.
              - listitem [ref=f98e301]: Experience with government cloud hosting environments AWS as well as both unit testing and end to end testing experience.
              - listitem [ref=f98e302]: Experience with code versioning and project management tools. (e.g. Jira, GitHub, Confluence, etc.)
              - listitem [ref=f98e303]: Demonstrated experience in a remote work environment.
            - generic [ref=f98e304]: "Preferred Skills and Experience:"
            - list [ref=f98e306]:
              - listitem [ref=f98e307]: Proven experience working with the VA and/or other Federal agencies, with a deep understanding of federal processes and regulations.
              - listitem [ref=f98e308]: Strong familiarity with the VA.gov platform and its ecosystem, demonstrating the ability to navigate and optimize its features effectively.
              - listitem [ref=f98e309]: Knowledgeable in government cloud hosting solutions, including AWS, and adept at managing web hosting environments.
              - listitem [ref=f98e310]: Proficient in managing API services within the VA network; skilled in handling and optimizing RESTful API transactions.
              - listitem [ref=f98e311]: Demonstrated expertise in system integrations, with a preference for candidates who have experience with CorpDB, MPI, BDN, and/or VBMS systems.
            - generic [ref=f98e312]: "Clearance Requirement: Must be able to obtain and maintain Public Trust / Suitability security clearance."
            - text: "Posted Salary Range: USD $90,000.00 - USD $100,000.00 /Yr."
