                          - table [ref=f38e768]:
                            - rowgroup [ref=f38e769]:
                              - row [ref=f38e770]:
                                - cell [ref=f38e771]:
                                  - strong [ref=f38e773]: PLEASE READ EACH PARAGRAPH CAREFULLY BEFORE SIGNING
                              - row [ref=f38e774]:
                                - cell [ref=f38e775]:
                                  - text: I have disclosed all information that is relevant and should be considered applicable to my candidacy for employment. I understand, where permissible under applicable state and local law, I may be subject to a pre-employment drug test after receiving a conditional offer of employment, and must receive a negative result for illegal drug use before being permitted to commence work with GovCIO. I understand, where permissible under applicable state and local law, I may be subject to a pre-employment medical examination after receiving a conditional offer of employment, and must meet the qualifications for the position, with or without reasonable accommodation, before being permitted to commence work with GovCIO. I understand, where permissible under applicable state and local law, I may be subject to a pre-employment background check after receiving a conditional offer of employment to investigate my criminal background and other matters related to my suitability for employment.
                                  - strong [ref=f38e777]: Initials
                                  - textbox "Initials1" [ref=f38e779]
                              - row [ref=f38e780]:
                                - cell [ref=f38e781]:
                                  - paragraph [ref=f38e782]: I certify that, if employed, my employment with GovCIO will not conflict with, or result in the violation of, breach of, or default under, any contract, agreement, or understanding that I am a party to or bound by.
                                  - paragraph [ref=f38e783]: I certify that, if employed, I will properly report if I am ever harassed by someone in GovCIO or if I ever become aware of any unethical behavior by any employee.
                                  - paragraph [ref=f38e784]:
                                    - strong [ref=f38e786]: Initials
                                    - textbox "Initials2" [ref=f38e788]
                              - row [ref=f38e789]:
                                - cell [ref=f38e790]:
                                  - text: I understand employment with GovCIO is also contingent on my providing sufficient documentation necessary to establish my identity and eligibility to work in the United States. If employed, I understand that as a condition of employment that I may be required to agree to and sign a non-solicitation, non-disclosure, and/or other similar agreements. I also agree to notify the organization during the pre-employment process of any non-solicitation, non-disclosure, and/or other similar agreements that I may have already signed with current and former employers. I expressly understand and agree that, if employed, my employment, having no specified term, is based upon mutual consent and may be terminated at-will, with or without cause, by either party (GovCIO or me) without prior notice to the other, unless otherwise prohibited by law. I understand that no representation, whether oral or written, by any representative or agent of GovCIO, at any time, can constitute an implied or express contract of employment. I further understand no representative or agent of GovCIO has the authority to enter into an agreement for employment for any specified period of time or to make any change in any policy, procedure, benefit or other terms or condition of employment other than in a document signed by an authorized representative. I understand that the technical processing and transmission of the application, including my personal information, may involve (a) transmissions over various networks, including the transfer of this information to the United States and/or other countries for storage, processing and use by Company, its affiliates, and their agents; and (b) changes to conform and adapt to technical requirements of connecting networks and devices. Accordingly, I agree to permit such parties to make such transmissions and changes, and hereby provide the necessary consent for the same.
                                  - strong [ref=f38e792]: Initials
                                  - textbox "Initials3" [ref=f38e794]
                              - row [ref=f38e795]:
                                - cell [ref=f38e796]:
                                  - strong [ref=f38e798]: "State Specific Notices Massachusetts Applicants: IT IS UNLAWFUL IN MASSACHUSETTS TO REQUIRE OR ADMINISTER A LIE DETECTOR TEST AS A CONDITION OF EMPLOYMENT OR CONTINUED EMPLOYMENT. AN EMPLOYER WHO VIOLATES THIS LAW SHALL BE SUBJECT TO CRIMINAL PENALTIES AND CIVIL LIABILITIES. Maryland Applicants: UNDER MARYLAND LAW, AN EMPLOYER MAY NOT REQUIRE OR DEMAND, AS A CONDITION OF EMPLOYMENT, PROSPECTIVE EMPLOYMENT, OR CONTINUED EMPLOYMENT, THAT AN INDIVIDUAL SUBMIT TO OR TAKE A POLYGRAPH EXAMINATION OR SIMILAR TEST. AN EMPLOYER WHO VIOLATES THIS LAW IS GUILTY OF A MISDEMEANOR AND SUBJECT TO A FINE NOT EXCEEDING $100."
                                  - text: "I certify that all of the above information is true and complete, and I understand that any falsification or omission of information may disqualify me from further consideration for employment or, if hired, may result in termination regardless of the time elapsed before discovery. Note: An offer of employment is conditioned upon complying with Company's requirements including, but not limited to, signing a consent to conduct a background investigation."
                                  - strong [ref=f38e800]: I AGREE, AND IT IS MY INTENT, TO SIGN THIS EMPLOYMENT APPLICATION BY CHECKING THE "I ACCEPT" BOX BELOW AND BY ELECTRONICALLY SUBMITTING THIS DOCUMENT TO COMPANY, I UNDERSTAND THAT MY SIGNING AND SUBMITTING THIS DOCUMENT IN THIS FASHION IS THE LEGAL EQUIVALENT OF HAVING PLACED MY HANDWRITTEN SIGNATURE ON THE SUBMITTED DOCUMENT.
