                            - strong [ref=f38e14]:
                              - text: Please review the information in the Employment Application form below carefully and complete the remaining required fields before submitting.
                              - generic [ref=f38e15]:
                                - text: T
                                - generic [ref=f38e16]: he information provided in this form will be verified as part of the standard background check process including employment and education history and identity verification
                          - list [ref=f38e17]:
                            - listitem [ref=f38e18]:
