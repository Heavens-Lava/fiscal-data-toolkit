                              - paragraph [ref=f38e22]:
                                - strong [ref=f38e23]: Ensure the employment history below covers the full past 7 years, to include any unemployment periods, as well as the highest level of education completed to assist with an efficient onboarding process.
                            - listitem [ref=f38e24]:
                              - strong [ref=f38e26]: If the information is correct, click “Submit” at the bottom of the page.
