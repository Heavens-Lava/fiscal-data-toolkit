                - generic [ref=f16e178]:
                  - text: Overview
                  - paragraph [ref=f16e179]:
                    - text: We are looking for a
                    - strong [ref=f16e180]: Software Engineer 2 - CoreAI
                    - text: to join our close-knit
                    - strong [ref=f16e181]: Azure Logic Apps team
                    - text: as a part of
                    - strong [ref=f16e182]: CoreAI
                    - text: at Microsoft. This full-stack role will contribute across customer-facing web experiences and the services that support them, with an emphasis on building responsive, accessible, and high-performance experiences.
                  - paragraph [ref=f16e183]: Prior web, platform, or services experience is a plus, or show us your passion for learning and growing across these essential skills. We are looking for an engineer who is comfortable incorporating AI-assisted development into day-to-day work and using approved tools to understand code, plan changes, generate and refactor code, create tests, debug issues, review implementations, and automate routine engineering tasks.
                  - paragraph [ref=f16e184]: Our team has a strong track record of delivering continuous improvements on a frequent release schedule. This role offers opportunities to write substantial production code, to solve hard problems, and to continuously challenge yourself. As a member of an agile team, you will be expected to adapt to new areas and challenges quickly.
                  - paragraph [ref=f16e185]: Microsoft’s mission is to empower every person and every organization on the planet to achieve more. As employees, we come together with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day, we build on our values of respect, integrity, and accountability to create a culture of inclusion where everyone can thrive at work and beyond. In alignment with our Microsoft values, we are committed to cultivating an inclusive work environment for all employees to positively impact our culture every day.
                  - text: Responsibilities
                  - paragraph [ref=f16e186]: "Our integration application platform has rapid adoption and momentum. We are building on this momentum by adding capabilities that help users author, manage, and monitor their workflows smoothly and run them at massive scale. We are looking for an Software Engineer 2 - CoreAI who will:"
                  - list [ref=f16e187]:
                    - listitem [ref=f16e188]: Contribute across the stack, building customer-facing web capabilities with TypeScript and React and the supporting APIs and services with C# and .NET.
                    - listitem [ref=f16e189]: Design, develop, test, and ship high-quality features.
                    - listitem [ref=f16e190]: Translate customer scenarios into intuitive and accessible experiences.
                    - listitem [ref=f16e191]: Improve performance, scalability, resiliency, and reliability; and troubleshoot issues across web applications and online services.
                    - listitem [ref=f16e192]: Use approved AI coding assistants and command-line agents, such as GitHub Copilot CLI and Claude Code, to accelerate codebase exploration, implementation, refactoring, test creation, debugging, code review, documentation, and engineering automation.
                    - listitem [ref=f16e193]: Validate generated AI coding assistant output and follow security, privacy, licensing, and responsible-AI requirements.
                    - listitem [ref=f16e194]: Focus on shipping early and often similar to a team in a startup pace.
                    - listitem [ref=f16e195]: Contribute to building a culture around delivering differentiated customer value, applying sound engineering practices, and collaborating effectively across product, design, and engineering.
                  - text: Qualifications
                  - generic [ref=f16e196]:
                    - paragraph [ref=f16e197]:
                      - heading "Required/Minimum Qualifications:" [level=3] [ref=f16e198]
                    - list [ref=f16e200]:
                      - listitem [ref=f16e201]:
                        - text: Bachelor's Degree in Computer Science or related technical field AND 2+ years technical engineering experience with coding in languages including, but not limited to JavaScript, or TypeScript
                        - list [ref=f16e202]:
                          - listitem [ref=f16e203]: OR equivalent experience.
                  - generic [ref=f16e205]:
                    - strong [ref=f16e207]: "Other Requirements:"
                    - strong [ref=f16e209]: "Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include, but are not limited to the following specialized security screenings:"
                    - list [ref=f16e210]:
                      - listitem [ref=f16e211]: "Microsoft Cloud Background Check: This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter."
                    - strong [ref=f16e214]: "Preferred/Additional Qualifications:"
                    - list [ref=f16e215]:
                      - listitem [ref=f16e216]: 3+ years of software development experience developing web applications using JavaScript or TypeScript and a modern frontend framework such as React.
                      - listitem [ref=f16e217]: Professional experience designing, developing, and shipping high-quality software.
                      - listitem [ref=f16e218]: Experience building responsive and accessible web applications using TypeScript, React, or similar technologies.
                      - listitem [ref=f16e219]: Experience developing object-oriented applications or services using C#, Java, C++, or a similar language.
                      - listitem [ref=f16e220]: Experience designing or integrating APIs and working with distributed cloud services.
                      - listitem [ref=f16e221]: Experience with public cloud services, including Azure, AWS, or Google Cloud.
                      - listitem [ref=f16e222]: Experience using AI-assisted development tools, such as GitHub Copilot, GitHub Copilot CLI, Claude Code, or comparable tools, for coding, testing, debugging, code review, documentation, or developer-workflow automation.
                      - listitem [ref=f16e223]: Ability to evaluate AI-generated output for correctness, maintainability, security, privacy, and licensing considerations and to apply appropriate human review before use.
                      - listitem [ref=f16e224]: Proven ability to troubleshoot complex technical issues in web applications or online services.
                      - listitem [ref=f16e225]: Effective written and oral communication and collaboration skills.
                      - listitem [ref=f16e226]: Maturity and discipline in applying modern software engineering practices, including coding standards, code reviews, source control management, build processes, testing, and releasing.
                  - paragraph [ref=f16e228]: Software Engineering IC3 - The typical base pay range for this role across the U.S. is USD $102,100 - $202,200 per year. There is a different range applicable to specific work locations, within the San Francisco Bay area and New York City metropolitan area, and the base pay range for this role in those locations is USD $133,800 - $219,200 per year.
                  - paragraph
                  - paragraph [ref=f16e229]:
                    - text: "Certain roles may be eligible for benefits and other compensation. Find additional benefits and pay information here:"
                    - link "https://careers.microsoft.com/us/en/us-corporate-pay" [ref=f16e230] [cursor=pointer]:
                      - /url: https://careers.microsoft.com/us/en/us-corporate-pay
                  - paragraph [ref=f16e231]: This position will be open for a minimum of 5 days, with applications accepted on an ongoing basis until the position is filled.
                  - separator [ref=f16e232]
                  - paragraph [ref=f16e233]:
                    - text: Microsoft is an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to age, ancestry, citizenship, color, family or medical care leave, gender identity or expression, genetic information, immigration status, marital status, medical condition, national origin, physical or mental disability, political affiliation, protected veteran or military status, race, ethnicity, religion, sex (including pregnancy), sexual orientation, or any other characteristic protected by applicable local laws, regulations and ordinances. If you need assistance with religious accommodations and/or a reasonable accommodation due to a disability during the application process, read more about
                    - link "requesting accommodations." [ref=f16e234] [cursor=pointer]:
                      - /url: https://careers.microsoft.com/v2/global/en/accessibility.html
