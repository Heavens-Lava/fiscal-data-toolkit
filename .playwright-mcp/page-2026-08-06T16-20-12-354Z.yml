                - generic [ref=f38e408]: X
                - generic [ref=f38e409]: "Applicants in San Francisco: Qualified applications with arrest or conviction records will be considered for employment in accordance with the San Francisco Fair Chance Ordinance for Employers and the California Fair Chance Act.Note: By applying to this position you will have an opportunity to share your preferred working location from the following: Mountain View, CA, USA; Palo Alto, CA, USA; San Bruno, CA, USA; San Francisco, CA, USA; Sunnyvale, CA, USA."
              - heading "Minimum qualifications:" [level=3] [ref=f38e410]
              - list [ref=f38e411]:
                - listitem [ref=f38e412]: Bachelor's degree or equivalent practical experience.
                - listitem [ref=f38e413]: 2 years of experience programming in C++, Python, or Java.
                - listitem [ref=f38e414]: 2 years of experience programming in JavaScript or TypeScript.
                - listitem [ref=f38e415]: 2 years of experience with front-end frameworks, full-stack development, or API development.
              - heading "Preferred qualifications:" [level=3] [ref=f38e416]
              - list [ref=f38e417]:
                - listitem [ref=f38e418]: Master's degree or PhD in Computer Science or related technical fields.
                - listitem [ref=f38e419]: 2 years of experience with data structures and algorithms in either an academic or industry setting.
                - listitem [ref=f38e420]: 2 years of experience with performance, large-scale systems data analysis, visualization tools, or debugging.
                - listitem [ref=f38e421]: Experience developing accessible technologies.
                - listitem [ref=f38e422]: Proficiency in code and system health, diagnosis and resolution, and software test engineering.
            - generic [ref=f38e423]:
              - heading "About the job" [level=3] [ref=f38e424]
              - text: Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google’s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.
              - paragraph [ref=f38e425]: With your technical expertise, you will manage project priorities, deadlines, and deliverables. You will design, develop, test, deploy, maintain, and enhance software solutions.
              - paragraph
              - text: "Individual pay is determined by factors including job-related skills, experience, and relevant education or training. US: $147000 - $211000 (USD) + 15% bonus target + equity + benefitsLearn more about"
              - link "benefits at Google" [ref=f38e426] [cursor=pointer]:
                - /url: https://www.google.com/about/careers/applications/benefits/
              - text: .
            - generic [ref=f38e427]:
              - heading "Responsibilities" [level=3] [ref=f38e428]
              - list [ref=f38e429]:
                - listitem [ref=f38e430]: Write product or system development code.
                - listitem [ref=f38e431]: Participate in, or lead, design reviews with peers and stakeholders to decide amongst available technologies.
                - listitem [ref=f38e432]: Review code developed by other developers and provide feedback to ensure best practices (e.g., style guidelines, checking code in, accuracy, testability, and efficiency).
                - listitem [ref=f38e433]: Contribute to existing documentation or educational content and adapt content based on product/program updates and user feedback.
                - listitem [ref=f38e434]: Triage product or system issues and debug/track/resolve by analyzing the sources of issues and the impact on hardware, network, or service operations and quality.
