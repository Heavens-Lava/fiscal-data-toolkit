                  - generic [ref=f11e1006]:
                    - text: Overview
                    - generic [ref=f11e1007]:
                      - paragraph [ref=f11e1008]: Microsoft Advertising is a $15B+ business that helps advertisers connect with customers across search, display, and emerging AI-powered channels. We work closely with leading global brands to improve their return on investment, incubate new initiatives, and shape the future of digital advertising.
                      - paragraph [ref=f11e1009]:
                        - text: The Microsoft Advertising Web UI team builds modern, scalable, accessible, and AI-powered frontend experiences that enable advertisers to create, manage, analyze, and optimize campaigns. As a
                        - strong [ref=f11e1010]: Senior Software Engineer
                        - text: ", you will collaborate with engineers, product managers, designers, and partner teams to deliver intuitive, reliable, and high-performance web experiences using React, TypeScript, JavaScript, and other modern frontend technologies."
                      - paragraph [ref=f11e1011]: Microsoft’s mission is to empower every person and every organization on the planet to achieve more. We work with a growth mindset, innovate to empower others, and collaborate to realize our shared goals. Each day, we build on our values of respect, integrity, and accountability to create an inclusive culture where everyone can thrive at work and beyond.
                    - text: Responsibilities
                    - paragraph [ref=f11e1012]:
                      - strong [ref=f11e1013]: Product Development, Ownership, and Code Review
                    - paragraph [ref=f11e1014]: • Independently design, code, test, and deliver extensible, maintainable, secure, accessible, and performant Web UI solutions using React, TypeScript, JavaScript, and modern frontend technologies.
                    - paragraph [ref=f11e1015]: • Take end-to-end ownership of product features, proactively identifying blockers and risks, communicating timeline impacts, and driving strategies to unblock delivery.
                    - paragraph [ref=f11e1016]: • Apply a customer-obsessed, product-engineering mindset when making design, quality, performance, and delivery trade-offs.
                    - paragraph [ref=f11e1017]: • Deliver timely, high-quality code reviews that improve coding patterns, security, compliance, test coverage, and engineering best practices.
                    - paragraph [ref=f11e1018]: • Use automated analysis, telemetry, and engineering metrics to continuously improve code quality and product stability.
                    - paragraph [ref=f11e1019]:
                      - strong [ref=f11e1020]: AI-Native Development
                    - paragraph [ref=f11e1021]: • Apply an AI-first mindset and use AI tools responsibly across requirements, design, development, testing, debugging, and documentation.
                    - paragraph [ref=f11e1022]: • Take responsibility for the quality, security, and correctness of AI-generated artifacts while helping teammates adopt effective AI-assisted engineering practices.
                    - paragraph [ref=f11e1023]: • Experiment with emerging AI capabilities and use engineering-health measures such as Accelerate, SPACE, and ESSP to improve team processes and productivity.
                    - paragraph [ref=f11e1024]:
                      - strong [ref=f11e1025]: Design and Architecture
                    - paragraph [ref=f11e1026]: • Lead the architecture and technical design of complex Web UI features, evaluating design alternatives and documenting their strengths and trade-offs.
                    - paragraph [ref=f11e1027]: • Ensure solutions meet performance, scalability, resiliency, accessibility, security, privacy, and compliance requirements.
                    - paragraph [ref=f11e1028]: • Identify and manage upstream and downstream dependencies across services and partner teams.
                    - paragraph [ref=f11e1029]: • Develop testable architectures and comprehensive strategies covering unit, integration, end-to-end, accessibility, security, and regression testing.
                    - paragraph [ref=f11e1030]: • Build reusable UI components, frontend frameworks, and engineering patterns that improve consistency and developer productivity.
                    - paragraph [ref=f11e1031]:
                      - strong [ref=f11e1032]: Engineering Excellence
                    - paragraph [ref=f11e1033]: • Drive engineering excellence by applying secure design principles, frontend best practices, automation, and safe deployment processes.
                    - paragraph [ref=f11e1034]: • Champion improvements to Web UI performance, accessibility, reliability, maintainability, and developer experience.
                    - paragraph [ref=f11e1035]: • Introduce new initiatives, tools, and engineering practices that make development and validation faster and more effective.
                    - paragraph [ref=f11e1036]: • Ensure privacy, security, safety, accessibility, and compliance requirements are incorporated throughout the development lifecycle.
                    - paragraph [ref=f11e1037]: • Mentor and coach engineers through technical guidance, code-review feedback, and leading by example with a strong growth mindset.
                    - paragraph [ref=f11e1038]:
                      - strong [ref=f11e1039]: Delivery and Reliability
                    - paragraph [ref=f11e1040]: • Collaborate with product managers, designers, researchers, and engineering partners to drive project plans, release plans, estimation, and delivery.
                    - paragraph [ref=f11e1041]: • Use experimentation, feature flags, flighting, success metrics, and guardrail metrics to evaluate product changes and minimize customer impact.
                    - paragraph [ref=f11e1042]: • Deploy changes safely using established frameworks, staged rollouts, monitoring, and rollback plans.
                    - paragraph [ref=f11e1043]: • Integrate privacy-aware logging, instrumentation, and telemetry into dashboards and alerts to monitor performance, reliability, availability, and usage.
                    - paragraph [ref=f11e1044]: • Act as a designated responsible individual during live-site incidents, respond within SLA, communicate status, and drive mitigation.
                    - paragraph [ref=f11e1045]: • Reduce incident volume by improving troubleshooting guides, automated tests, monitoring, operational tools, and incident postmortems.
                    - text: Qualifications
                    - paragraph [ref=f11e1046]:
                      - heading "Required Qualifications:" [level=3] [ref=f11e1047]
                    - list [ref=f11e1048]:
                      - listitem [ref=f11e1049]: Bachelor's Degree in Computer Science or related technical field AND 8+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python OR equivalent experience.
                      - listitem [ref=f11e1050]: Experience developing production web applications using JavaScript or TypeScript and a modern frontend framework.
                      - listitem [ref=f11e1051]: Understanding of software engineering fundamentals, including data structures, algorithms, software design, testing, and version control.
                      - listitem [ref=f11e1052]: Experience designing, debugging, and maintaining reliable and maintainable software.
                      - listitem [ref=f11e1053]: Demonstrated ability to collaborate effectively with engineers, product managers, designers, and cross-functional partners.
                      - listitem [ref=f11e1054]: AI-native development orientation and willingness to use AI tools responsibly throughout the software development lifecycle.
                      - listitem [ref=f11e1055]: Strong problem-solving skills, attention to detail, and ownership of complex or ambiguous technical problems.
                      - listitem [ref=f11e1056]: Effective written and verbal communication skills, including the ability to document technical decisions and collaborate across teams and time zones.
                      - listitem [ref=f11e1057]: Growth mindset, openness to feedback, and commitment to continuous learning.
                      - listitem [ref=f11e1058]: Ability to meet Microsoft, customer, and/or government security-screening requirements. This includes passing the Microsoft Cloud Background Check upon hire or transfer and every two years thereafter.
                    - paragraph [ref=f11e1059]:
                      - strong [ref=f11e1060]: "Other Requirements:"
                      - text: "Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include but are not limited to the following specialized security screenings:"
                    - paragraph [ref=f11e1061]:
                      - strong [ref=f11e1062]: Microsoft Cloud Background Check
                      - text: ": This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter."
                    - paragraph [ref=f11e1063]:
                      - heading "Preferred Qualification:" [level=3] [ref=f11e1064]
                    - list [ref=f11e1065]:
                      - listitem [ref=f11e1066]: Master’s Degree in Computer Science or a related technical field and 6+ years of technical engineering experience; OR Bachelor’s Degree in Computer Science or a related technical field and 8+ years of technical engineering experience; OR equivalent experience.
                      - listitem [ref=f11e1067]: Strong experience with React, TypeScript, JavaScript, HTML, CSS, state-management technologies, and modern frontend build and testing frameworks.
                      - listitem [ref=f11e1068]: Experience architecting large-scale, modular web applications and reusable component libraries.
                      - listitem [ref=f11e1069]: Knowledge of frontend performance optimization, browser behavior, responsive design, telemetry, and experimentation.
                      - listitem [ref=f11e1070]: Experience implementing accessible experiences using WCAG and inclusive-design standards.
                      - listitem [ref=f11e1071]: Experience with Azure, distributed services, REST APIs, or GraphQL integrations.
                      - listitem [ref=f11e1072]: Experience with automated testing, CI/CD pipelines, feature flighting, and safe deployment practices.
                      - listitem [ref=f11e1073]: Strong debugging and troubleshooting skills across UI, API, and data layers.
                    - paragraph [ref=f11e1074]: "#W+D"
                    - paragraph [ref=f11e1075]: This position will be open for a minimum of 5 days, with applications accepted on an ongoing basis until the position is filled.
                    - separator [ref=f11e1076]
                    - paragraph [ref=f11e1077]:
