    - main [ref=f101e61]:
      - article [ref=f101e65]:
        - generic [ref=f101e66]:
          - generic [ref=f101e69]:
            - paragraph [ref=f101e70]: Careers
            - heading "Software Engineer I (Remote Eligible)" [level=1] [ref=f101e71]
          - generic [ref=f101e72]:
            - generic [ref=f101e74]:
              - paragraph [ref=f101e76]: "For over 20 years, Smartsheet has empowered teams to manage work seamlessly and scale solutions smarter. Now, in our most ambitious chapter yet, we are uniting human teams with AI agents. By orchestrating the work agents do best, automating manual tasks and uncovering insights at scale, we create the space for people to focus on what truly matters: judgment, creativity, and big thinking. That is magic at work, and it’s what we show up for every day."
              - paragraph [ref=f101e77]: We are hiring a Software Engineer I to join our Engineering team. You will get your hands on full-stack services, dig into distributed systems problems, and work right at the intersection of traditional software engineering and AI-driven development. We are not just dabbling in AI here. We use it to write better code, catch bugs faster, and troubleshoot smarter, and we want engineers who want to get good at that too and help their teammates do the same. You will ship real features, sit in on architectural conversations that actually shape the product, and grow alongside a team that cares as much about doing good work as they do about doing meaningful work.
              - paragraph [ref=f101e78]:
                - strong [ref=f101e79]: "You Will:"
              - list [ref=f101e80]:
                - listitem [ref=f101e81]: Build scalable front-end and back-end services for the next generation of applications at Smartsheet (Kotlin, Java, Typescript, React)
                - listitem [ref=f101e82]: Solve challenging distributed systems problems and work with modern cloud infrastructure (AWS, Kubernetes)
                - listitem [ref=f101e83]: Take part in code reviews and architectural discussions as you work with other software engineers and product managers
                - listitem [ref=f101e84]: Forge a strong partnership with product management and other key areas of the business
                - listitem [ref=f101e85]: Enhance existing application code with new features and strike a balance when making technical decisions (build vs refactor vs simplify)
                - listitem [ref=f101e86]: Actively use AI tools to improve personal and team efficiency across coding, testing, design, and troubleshooting, exploring AI integration opportunities within team processes and features, and coaching others on effective AI use
              - paragraph [ref=f101e87]:
                - strong [ref=f101e88]: "You Have:"
              - list [ref=f101e89]:
                - listitem [ref=f101e90]: 1+ years software development experience building highly scalable, highly available applications
                - listitem [ref=f101e91]: 1+ years of programming experience with full stack technologies such Java, Kotlin, Python or TypeScript
                - listitem [ref=f101e92]: 1+ years of experience with cloud technologies (AWS, Azure, etc.)
                - listitem [ref=f101e93]: Experience developing, documenting, and supporting REST APIs
                - listitem [ref=f101e94]: 6+ months professional experience leveraging AI to improve personal productivity in service of building complex SaaS feature sets
                - listitem [ref=f101e95]: A degree in Computer Science, Engineering, or a related field or equivalent practical experience
                - listitem [ref=f101e96]: Adaptable as priorities or problems change
                - listitem [ref=f101e97]: Ready to take ownership of your work and grow into bigger challenges
                - listitem [ref=f101e98]: A clear written and verbal communicator, able to explain your thinking in code reviews, documentation, and team discussions
                - listitem [ref=f101e99]: Legally eligible to work in the U.S. on an ongoing basis
              - generic [ref=f101e101]:
                - generic [ref=f101e102]:
                  - paragraph [ref=f101e103]:
                    - strong [ref=f101e104]: "Current US Perks & Benefits:"
                  - list [ref=f101e105]:
                    - listitem [ref=f101e106]: Employer subsidized medical/vision and dental coverage for full-time employees
                    - listitem [ref=f101e107]: 401k Match to help you save for your future (50% of your contribution up to the first 6% of your eligible pay)
                    - listitem [ref=f101e108]: Monthly stipend to support your work and productivity
                    - listitem [ref=f101e109]: Flexible Time Away Program, plus Sick Time Off
                    - listitem [ref=f101e110]: US employees are automatically covered under Smartsheet-sponsored life insurance, short-term, and long-term disability plans
                    - listitem [ref=f101e111]: US employees receive 12 paid holidays per year
                    - listitem [ref=f101e112]: Up to 24 weeks of Parental Leave
                    - listitem [ref=f101e113]: Personal paid Volunteer Day to support our community
                    - listitem [ref=f101e114]: Opportunities for professional growth and development including access to Udemy online courses
                    - listitem [ref=f101e115]: Company Funded Perks, including a counseling membership, local retail discounts, and your own personal Smartsheet account
                    - listitem [ref=f101e116]: Teleworking options from any registered location in the U.S. (role specific)
                  - paragraph [ref=f101e117]:
                    - emphasis [ref=f101e118]: Smartsheet provides a competitive base salary range for roles that may be hired in different geographic areas we are licensed to operate our business from. Actual compensation is determined by several factors including, but not limited to, level of professional, educational experience, skills, and specific candidate location. In addition, this role will be eligible for a market competitive incentive opportunity.
                - generic [ref=f101e119]: US Base Salary Pay Range
                - generic [ref=f101e120]: $107,500—$147,500 USD
              - generic [ref=f101e121]:
                - paragraph [ref=f101e122]
                - paragraph [ref=f101e123]:
                  - strong [ref=f101e124]: "Get to Know Us:"
                - paragraph [ref=f101e125]: At Smartsheet, your ideas are heard, your potential is supported, and your contributions have real impact. You’ll have the freedom to explore, push boundaries, and grow beyond your role. We welcome diverse perspectives and nontraditional paths—because we know that impact comes from individuals who care deeply and challenge thoughtfully. When you’re doing work that stretches you, excites you, and connects you to something bigger, that’s magic at work. Let’s build what’s next, together.
                - paragraph [ref=f101e126]:
                  - strong [ref=f101e127]: "Equal Opportunity Employer:"
                - paragraph [ref=f101e128]: Smartsheet is an Equal Opportunity (EEO) employer committed to fostering an inclusive environment with the best employees. It is our policy to provide equal employment opportunities to all qualified applicants in accordance with applicable laws in the US, UK, Australia, Germany, Costa Rica, Japan, Bulgaria, India, and Singapore. All qualified applicants will receive consideration without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, protected veteran or disabled status, or genetic information.
                - paragraph [ref=f101e129]: If there are preparations we can make to help ensure you have a comfortable and positive interview experience, please let us know.
                - paragraph [ref=f101e130]
