            - generic [ref=f66e556]:
              - heading "Voluntary Self-Identification of Disability" [level=2] [ref=f66e557]
              - generic [ref=f66e558]:
                - generic [ref=f66e559]:
                  - generic [ref=f66e560]: Form CC-305
                  - generic [ref=f66e561]: Page 1 of 1
                - generic [ref=f66e562]:
                  - generic [ref=f66e563]: OMB Control Number 1250-0005
                  - generic [ref=f66e564]: Expires 04/30/2026
              - strong [ref=f66e565]: Why are you being asked to complete this form?
              - paragraph [ref=f66e566]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f66e567]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f66e568] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f66e569]: How do you know if you have a disability?
              - paragraph [ref=f66e570]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f66e571]: "Disabilities include, but are not limited to:"
              - list [ref=f66e572]:
                - listitem [ref=f66e573]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f66e574]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f66e575]: Blind or low vision
                - listitem [ref=f66e576]: Cancer (past or present)
                - listitem [ref=f66e577]: Cardiovascular or heart disease
                - listitem [ref=f66e578]: Celiac disease
                - listitem [ref=f66e579]: Cerebral palsy
                - listitem [ref=f66e580]: Deaf or serious difficulty hearing
