                        - generic [ref=f30e550]: Description
                        - textbox "Description" [ref=f30e553]: "Route management and daily delivery to 400-500 addresses; five years of consistent, independent field work. INDEPENDENT PROJECTS Fiscal Data Toolkit github.com/Heavens-Lava/fiscal-data-toolkit → - https://github.com/Heavens-Lava/fiscal-data-toolkit A large collection of zero-dependency Node.js scripts and a web dashboard pulling live U.S. fiscal, banking, and company-financials data from government and financial REST APIs (Treasury, FDIC, FRED, SEC EDGAR, USASpending.gov), plus labor-market data - real-time job listings from company ATS platforms (Greenhouse, Lever) and BLS employment statistics - built independently to explore federal spending, banking, markets, and the job market itself. OpenFinance github.com/Heavens-Lava/openfinance → - https://github.com/Heavens-Lava/openfinance Live: jeffreymacy.com/openfinance → - https://www.jeffreymacy.com/#/openfinance My first publicly shared community app - a free, local-first personal finance dashboard anyone can download and run. Drop in bank CSV exports for spending breakdowns, cash-flow visualization, and net-worth tracking, entirely client-side with no server contact or account linking."
