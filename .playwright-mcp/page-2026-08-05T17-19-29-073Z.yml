        - generic [ref=f44e521]:
          - generic [ref=f44e522]:
            - heading "Senior Software Engineer, Full-stack" [level=1] [ref=f44e523]
            - generic [ref=f44e524]: San Francisco, CA | New York City, NY | Seattle, WA
          - button "Apply" [ref=f44e528] [cursor=pointer]
        - generic [ref=f44e529]:
          - generic [ref=f44e530]:
            - heading [level=2] [ref=f44e531]:
              - strong [ref=f44e532]: About Anthropic
            - paragraph [ref=f44e533]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f44e534]:
            - heading "About the role" [level=2] [ref=f44e536]
            - generic [ref=f44e537]:
              - paragraph [ref=f44e538]:
                - text: Anthropic’s Product Engineering org is looking for experienced engineers with strong full-stack fundamentals to join one of teams owning our current or emergent products. You'll be a technical leader who thinks holistically about the consumer and/or enterprise end user experience - be that via
                - link "Claude.ai" [ref=f44e539] [cursor=pointer]:
                  - /url: http://claude.ai
                - text: ", the Anthropic API, enterprise deployments, Claude Code, or mission-driven applications - and carry real end-to-end ownership. You'll partner with engineering managers, product leaders, designers, and researchers to understand new model capabilities and redefine what is possible for users in the world of LLMs - and how to build it. We’ll look to you to have a product-oriented mindset and input, own technical quality across the stack (performance, accessibility, reliability, and developer experience), scale your efforts to millions of users on a global scale, and carry genuine excitement about what AI makes possible."
                - emphasis [ref=f44e540]: We have multiple teams that are currently hiring. Team placement occurs after the interview process, taking into account your interests and experience alongside organizational needs. This flexible approach allows us to match talented engineers with the backend product efforts where they'll have the greatest impact and growth potential.
              - generic [ref=f44e542]:
                - heading "What you'll do:" [level=2] [ref=f44e543]
                - paragraph [ref=f44e544]:
                  - strong [ref=f44e545]: "Developer Experience:"
                  - text: You'll build the products and tools - console, SDKs, docs, and observability - that give developers the confidence to rely on Claude in their most critical applications. Our mission is to meet developers where they are and bring them closer to the ceiling of what's possible with our models and API. That means building trust through great platform fundamentals, inspiring developers to raise the bar in how they use Claude's capabilities, and accelerating the path to agentic development by designing for both human and AI developers. You'll work closely with teams across the Platform org to turn Claude's newest capabilities into experiences developers can actually pick up and run with - from first prompt to production agent.
                - paragraph [ref=f44e546]:
                  - strong [ref=f44e547]: "Beneficial Deployments:"
                  - text: Beneficial Deployments Engineering brings Claude to organizations doing the most good with the fewest resources — nonprofits, schools, healthcare providers, researchers, and economic mobility programs.We're looking for a full-stack engineer to build the access programs, tooling, and product work that make frontier AI usable for teams that couldn't afford this capacity any other way.
                - paragraph [ref=f44e548]:
                  - strong [ref=f44e549]: "Vertical AI Products:"
                  - text: "Purpose-built experiences for specific industries where Claude can transform complex professional work. We're currently building for three verticals, with more to come:"
                - list [ref=f44e550]:
                  - listitem [ref=f44e551]:
                    - strong [ref=f44e552]: Financial Services
                    - text: — analysts and bankers across investment banking, asset management, insurance, and corporate finance, building models, memos, and decks under deadline. We're building deeply integrated experiences inside the tools they already use — retrieval, analysis, and document generation that holds up to executive review.
                  - listitem [ref=f44e553]:
                    - strong [ref=f44e554]: Life Sciences
                    - text: "— an agentic research platform for scientists: specialist agents for computational biology, literature review, and regulatory review, built on model capabilities we're investing in for biology and chemistry. Live with early customers and expanding fast."
                  - listitem [ref=f44e555]:
                    - strong [ref=f44e556]: Healthcare
                    - text: — spanning payer workflows like claims, prior authorization, and utilization management, as well as clinical applications. Work where accuracy isn't a feature, it's the whole product — and where compliance is part of the engineering.
                - paragraph [ref=f44e557]:
                  - strong [ref=f44e558]: "Enterprise AI Products:"
                  - text: "You'll work on the products that make Claude a daily-use tool for enterprise customers across industries – the connective tissue that lets Claude operate effectively across workflows. On this team you will systematically understand why Enterprise users aren't activating, what's blocking adoption, and building the capabilities to close those gaps.Some of our focuses are:"
                - list [ref=f44e559]:
                  - listitem [ref=f44e560]:
                    - emphasis [ref=f44e561]: Extensibility
                    - text: — plugins, skills, connectors, and the MCP ecosystem that lets a company shape Claude around their specific workflows and distribute that work across teams.
                  - listitem [ref=f44e562]:
                    - emphasis [ref=f44e563]: Context
                    - text: — enterprise knowledge, organizational memory, and the retrieval layer that makes Claude genuinely aware of a company's people, documents, and workflows. A connected, contextual Claude is the difference between a general-purpose chatbot and a real coworker.
                  - listitem [ref=f44e564]:
                    - emphasis [ref=f44e565]: Proactivity
                    - text: — Cowork suggestions, workflow capture, ambient Claude inside the apps people already use. Moving from "Claude answers when asked" to "Claude notices what you need".
                - paragraph [ref=f44e566]:
                  - strong [ref=f44e567]: "Public Sector:"
                  - text: "Build products that deliver Claude to the U.S. federal & state governments and allied democracies — from FedRAMP environments to classified networks. We're a startup-minded team with huge surface area: we own Claude for Government, ship zero-to-one products into the most regulated environments in the world, and work directly with the agencies using them."
                - paragraph [ref=f44e568]:
                  - strong [ref=f44e569]: "Enterprise Foundations:"
                  - text: "You'll build the systems large organizations require before they can adopt Claude at scale: identity and permissions, security and compliance controls, and the admin analytics that let them see how it's being used. This is the work that turns \"we love the demo\" into a signed enterprise deal.The role is part product, part platform. You'll work closely with Product and GTM to understand what our largest customers need, then build it once in a way that works across Claude.ai, Claude Code, and Cowork."
                - paragraph [ref=f44e570]:
                  - strong [ref=f44e571]: "Growth:"
                  - text: Drive user acquisition, engagement, retention, and monetization through data-driven strategies and technical implementations. At Anthropic, we're not just building AI tools; we're reimagining how AI can enhance and expand its user base! As a member of the growth team, you will have a unique opportunity to shape our growth strategy. You will work with a cross-functional team of engineers, data scientists, marketers, and product managers to design, implement, and optimize growth initiatives that scale our AI-powered tools and maximize their impact.
              - generic [ref=f44e573]:
                - heading "You might be a good fit if you:" [level=2] [ref=f44e574]
                - list [ref=f44e575]:
                  - listitem [ref=f44e576]: Have a minimum of 6 years of practical full-stack engineering experience
                  - listitem [ref=f44e577]: Have led the design and delivery of complex, consumer or B2B user-facing products across the full stack
                  - listitem [ref=f44e578]:
                    - text: Are technically proficient in
                    - emphasis [ref=f44e579]: modern
                    - text: frontend and backend development, with demonstrated depth in key languages and frameworks (ie. React, Typescript)
                  - listitem [ref=f44e580]: Take a product-focused approach to building solutions that are robust, scalable, and easy to use
                  - listitem [ref=f44e581]: Have worked in early start-up or otherwise fast moving, rapidly evolving environments, and have ideally built products from 0 to 1
                  - listitem [ref=f44e582]: Have successfully driven cross-team alignment to get impactful work shipped, and work with influence over authority
                  - listitem [ref=f44e583]: Have experience establishing engineering standards, component architectures, and development best practices
                  - listitem [ref=f44e584]: Thrive in fast-paced environments and can navigate ambiguity to deliver high-quality products
              - generic [ref=f44e586]:
                - paragraph [ref=f44e587]:
                  - strong [ref=f44e588]: "Deadline to apply:"
                  - text: None. Applications will be reviewed on a rolling basis.
                - paragraph [ref=f44e589]:
                  - strong [ref=f44e590]: "Location Preference:"
                  - text: Preference will be given to candidates based in NY, SEA, SF or the Bay Area given the current location of teams.
          - generic [ref=f44e592]:
            - generic [ref=f44e595]:
              - paragraph [ref=f44e596]: The annual compensation range for this role is listed below.
              - paragraph [ref=f44e597]: For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role.
            - paragraph [ref=f44e598]: "Annual Salary:"
            - paragraph [ref=f44e599]: $320,000 - $320,000 USD
          - generic [ref=f44e600]:
            - heading [level=2] [ref=f44e601]:
              - strong [ref=f44e602]: Logistics
            - paragraph [ref=f44e603]:
              - strong [ref=f44e604]: "Minimum education:"
              - text: Bachelor’s degree or an equivalent combination of education, training, and/or experience
            - paragraph [ref=f44e605]:
              - strong [ref=f44e606]: "Required field of study:"
              - text: A field relevant to the role as demonstrated through coursework, training, or professional experience
            - paragraph [ref=f44e607]:
              - strong [ref=f44e608]: "Minimum years of experience:"
              - text: Years of experience required will correlate with the internal job level requirements for the position
            - paragraph [ref=f44e609]:
              - strong [ref=f44e610]: "Location-based hybrid policy:"
              - text: Currently, we expect all staff to be in one of our offices at least 25% of the time. However, some roles may require more time in our offices.
            - paragraph [ref=f44e611]:
              - strong [ref=f44e612]: "Visa sponsorship:"
              - text: We do sponsor visas! However, we aren't able to successfully sponsor visas for every role and every candidate. But if we make you an offer, we will make every reasonable effort to get you a visa, and we retain an immigration lawyer to help with this.
            - paragraph [ref=f44e613]:
              - strong [ref=f44e614]: We encourage you to apply even if you do not believe you meet every single qualification.
              - text: Not all strong candidates will meet every single qualification as listed. Research shows that people who identify as being from underrepresented groups are more prone to experiencing imposter syndrome and doubting the strength of their candidacy, so we urge you not to exclude yourself prematurely and to submit an application if you're interested in this work. We think AI systems like the ones we're building have enormous social and ethical implications. We think this makes representation even more important, and we strive to include a range of diverse perspectives on our team.
              - strong [ref=f44e615]: Your safety matters to us.
              - text: To protect yourself from potential scams, remember that Anthropic recruiters only contact you from @anthropic.com email addresses. In some cases, we may partner with vetted recruiting agencies who will identify themselves as working on behalf of Anthropic. Be cautious of emails from other domains. Legitimate Anthropic recruiters will never ask for money, fees, or banking information before your first day. If you're ever unsure about a communication, don't click any links—visit
              - link "anthropic.com/careers" [ref=f44e617] [cursor=pointer]:
                - /url: http://anthropic.com/careers
              - text: directly for confirmed position openings.
            - heading [level=2] [ref=f44e618]:
              - strong [ref=f44e619]: How we're different
            - paragraph [ref=f44e620]: We believe that the highest-impact AI research will be big science. At Anthropic we work as a single cohesive team on just a few large-scale research efforts. And we value impact — advancing our long-term goals of steerable, trustworthy AI — rather than work on smaller and more specific puzzles. We view AI research as an empirical science, which has as much in common with physics and biology as with traditional efforts in computer science. We're an extremely collaborative group, and we host frequent research discussions to ensure that we are pursuing the highest-impact work at any given time. As such, we greatly value communication skills.
            - paragraph [ref=f44e621]: "The easiest way to understand our research directions is to read our recent research. This research continues many of the directions our team worked on prior to Anthropic, including: GPT-3, Circuit-Based Interpretability, Multimodal Neurons, Scaling Laws, AI & Compute, Concrete Problems in AI Safety, and Learning from Human Preferences."
            - heading [level=2] [ref=f44e622]:
              - strong [ref=f44e623]: Come work with us!
            - paragraph [ref=f44e624]:
              - text: Anthropic is a public benefit corporation headquartered in San Francisco. We offer competitive compensation and benefits, optional equity donation matching, generous vacation and parental leave, flexible working hours, and a lovely office space in which to collaborate with colleagues.
              - strong [ref=f44e625]: "Guidance on Candidates' AI Usage:"
              - text: Learn about
              - link "our policy" [ref=f44e626] [cursor=pointer]:
                - /url: https://www.anthropic.com/candidate-ai-guidance
              - text: for using AI in our application process.
