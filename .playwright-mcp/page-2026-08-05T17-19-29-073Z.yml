                - textbox "Additional Information" [ref=f44e814]: "Cover letter: Two of the teams you mention -- Public Sector and Beneficial Deployments -- describe almost exactly where I already work and who I've already worked for. I currently build production software for a state government: the official Arizona House and Senate websites, on one shared theme architecture, serving live legislative data with WCAG AA compliance built in at the token level, not bolted on later. Before this role, I spent over a year as a Family Support Specialist doing in-home coaching for families the system had mostly stopped paying attention to. I don't say that to pad the letter -- it's the same reason \"Public Sector\" and \"Beneficial Deployments\" caught my eye on this posting before \"Growth\" or \"Enterprise\" did. I've already spent my career, short as it is, on work aimed at people with the least resources to work around a bad tool. On the engineering side: React, TypeScript, and Tailwind in production, a structured content pipeline pulling bills and votes out of SQL Server into reusable views, and -- on my own time -- an MCP server and client built from scratch for an AI coding assistant I run on Anthropic's SDK. That's the combination this posting names -- full-stack craft plus a real reason to care about who the \"Public Sector\" and \"Beneficial Deployments\" teams are actually building for. I'm relocating for this role -- SF, NYC, or Seattle all work. Happy to go deeper on the Legislature build or the accessibility work specifically -- both are public, so you can look before you take my word for it. Jeffrey Macy"
