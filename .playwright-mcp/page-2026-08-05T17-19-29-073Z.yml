                - text: and confirm your understanding by selecting “Yes.”
            - generic [ref=f44e768]:
              - generic [ref=f44e770]:
                - generic [ref=f44e771]: Why Anthropic?*
                - textbox "Why Anthropic?" [ref=f44e772]: Two of the teams on this posting, Public Sector and Beneficial Deployments, describe almost exactly where I already work and who I've already worked for. I build production software for the Arizona State Legislature right now, the official House and Senate websites, serving live legislative data with WCAG AA accessibility built in at the token level, not bolted on afterward. Before that role, I spent over a year as a Family Support Specialist doing in-home coaching for families the system had mostly stopped paying attention to. I don't bring that up to pad this letter. It's the actual reason "Public Sector" and "Beneficial Deployments" caught my eye on this posting before "Growth" or "Enterprise" did. I've spent my career, short as it is, on work aimed at people with the fewest resources to work around a bad tool. On the engineering side, I write React, TypeScript, and Tailwind in production daily, maintain a structured content pipeline pulling bills and votes out of SQL Server into reusable views shared across two government sites, and on my own time I built an MCP server and client from scratch for an AI coding assistant I run on Anthropic's SDK. I think that MCP work matters here specifically. A lot of what "Public Sector" and "Beneficial Deployments" need is Claude showing up correctly inside institutions that already have their own systems, their own compliance requirements, their own reasons to be skeptical of a new vendor. That's a shape of problem I already understand, because it's the shape of problem I solve every day inside a state legislature's existing infrastructure. I want to work somewhere the safety mission isn't a slide in a deck, and somewhere "beneficial" means something more specific than a value statement. I think this is that place, and I think the Public Sector and Beneficial Deployments teams are where I'd do my best work.
              - paragraph [ref=f44e775]: Why do you want to work at Anthropic? (We value this response highly - great answers are often 200-400 words.)
