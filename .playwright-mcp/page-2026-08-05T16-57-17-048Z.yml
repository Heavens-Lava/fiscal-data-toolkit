            - generic [ref=f30e436]:
              - heading "Voluntary Self-Identification of Disability" [level=2] [ref=f30e437]
              - generic [ref=f30e438]:
                - generic [ref=f30e439]:
                  - generic [ref=f30e440]: Form CC-305
                  - generic [ref=f30e441]: Page 1 of 1
                - generic [ref=f30e442]:
                  - generic [ref=f30e443]: OMB Control Number 1250-0005
                  - generic [ref=f30e444]: Expires 04/30/2026
              - strong [ref=f30e445]: Why are you being asked to complete this form?
              - paragraph [ref=f30e446]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f30e447]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f30e448] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f30e449]: How do you know if you have a disability?
              - paragraph [ref=f30e450]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f30e451]: "Disabilities include, but are not limited to:"
              - list [ref=f30e452]:
                - listitem [ref=f30e453]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f30e454]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f30e455]: Blind or low vision
                - listitem [ref=f30e456]: Cancer (past or present)
                - listitem [ref=f30e457]: Cardiovascular or heart disease
                - listitem [ref=f30e458]: Celiac disease
                - listitem [ref=f30e459]: Cerebral palsy
                - listitem [ref=f30e460]: Deaf or serious difficulty hearing
                - listitem [ref=f30e461]: Diabetes
