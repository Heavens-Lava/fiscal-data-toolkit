        - generic [ref=f30e20]:
          - generic [ref=f30e21]:
            - heading [level=2] [ref=f30e22]:
              - strong [ref=f30e23]: About Anthropic
            - paragraph [ref=f30e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f30e25]:
            - heading [level=3] [ref=f30e26]:
              - strong [ref=f30e27]: About the role
            - paragraph [ref=f30e28]: At Anthropic, we're building AI systems that are safe, beneficial, and transformative. Our mission is to develop AI that benefits humanity, and we believe the most powerful capabilities emerge when we thoughtfully bridge the gap between research breakthroughs and real-world applications.
            - paragraph [ref=f30e29]
            - paragraph [ref=f30e30]: "Claude Design is the newest product from Anthropic Labs, the internal accelerator behind Claude Code and MCP. It lets anyone collaborate with Claude to create polished visual work: interactive prototypes, product mockups, slides, one-pagers, and marketing collateral. Start from a prompt, an image, or your own codebase, and Claude builds a first version that you refine through conversation, inline comments, direct edits, and live adjustment controls, then hand off to Claude Code to build for real. We launched in research preview in April 2026, and the product is new enough that the engineers who join now will define what it becomes."
            - paragraph [ref=f30e31]
            - paragraph [ref=f30e32]: "We're looking for Software Engineers to help build and shape Claude Design. This is a craft-heavy, frontend-leaning role: you'll create the canvas, real-time editing, design-system inference, and AI-driven generation experiences that make AI-generated design feel like a tool people reach for first– not a demo. You'll work at the intersection of cutting-edge research and real-world application, rapidly building and testing new experiences, partnering directly with researchers and users, and helping to generate the crucial insights that shape where the product goes next."
            - heading [level=3] [ref=f30e33]:
              - strong [ref=f30e34]: Responsibilities
            - list [ref=f30e35]:
              - listitem [ref=f30e36]:
                - paragraph [ref=f30e37]: Build and ship Claude Design's core surfaces (the design canvas, real-time editing, inline comments, and the live adjustment controls Claude generates), shipping early and often to maximize learning
              - listitem [ref=f30e38]:
                - paragraph [ref=f30e39]: Collaborate closely with research teams to turn frontier vision and generation capabilities into intuitive, high-craft design experiences
              - listitem [ref=f30e40]:
                - paragraph [ref=f30e41]: Work directly with designers, internal test users, and external partners to gather feedback, iterate quickly, and validate (or invalidate) product concepts
              - listitem [ref=f30e42]:
                - paragraph [ref=f30e43]: "Set technical direction for the hardest frontend problems: editor and canvas architecture, real-time collaboration, design-system inference, rich import/export, and performance as the product scales"
              - listitem [ref=f30e44]:
                - paragraph [ref=f30e45]: Design and run experiments to test product hypotheses, from prototype tests with users to evaluations of generation quality, balancing creative exploration with rigorous measurement
              - listitem [ref=f30e46]:
                - paragraph [ref=f30e47]: Own the quality bar for how the product looks and feels, treating latency, responsiveness, and reliability as first-class concerns rather than afterthoughts, and advocate for user experience and design considerations early in the process
              - listitem [ref=f30e48]:
                - paragraph [ref=f30e49]: Strengthen the handoff to Claude Code so designs translate cleanly into production, and feed insights back to research about model effectiveness and where capabilities can improve
              - listitem [ref=f30e50]:
                - paragraph [ref=f30e51]: "Operate as a technical leader on a small team: shape the roadmap alongside design and product, make pragmatic architecture decisions, and mentor engineers as the team grows"
            - heading [level=3] [ref=f30e52]:
              - strong [ref=f30e53]: You may be a good fit if you
            - list [ref=f30e54]:
              - listitem [ref=f30e55]:
                - paragraph [ref=f30e56]: Have 8+ years of experience building full-stack applications with deep frontend strength, and a track record of zero-to-one work in startup or startup-like environments
              - listitem [ref=f30e57]:
                - paragraph [ref=f30e58]: Have set technical direction for a team or workstream and mentored other engineers, while staying hands-on in the code
              - listitem [ref=f30e59]:
                - paragraph [ref=f30e60]: Have strong design sensibility and a high bar for craft; you sweat interaction details, motion, and polish
              - listitem [ref=f30e61]:
                - paragraph [ref=f30e62]: Have strong technical skills across modern web stacks (React, TypeScript, Node.js, Python, Go, etc.), including complex client-side state, performance, APIs, databases, and cloud technologies
              - listitem [ref=f30e63]:
                - paragraph [ref=f30e64]: Are comfortable working in a fast-moving environment where priorities shift and shipping quickly matters
              - listitem [ref=f30e65]:
                - paragraph [ref=f30e66]: "Are deeply user-centric: you enjoy validating ideas with actual users before over-investing and you talk about problems before solutions"
              - listitem [ref=f30e67]:
                - paragraph [ref=f30e68]: "Hold strong opinions loosely: you advocate forcefully for ideas but change your mind based on evidence"
              - listitem [ref=f30e69]:
                - paragraph [ref=f30e70]: Are a generalist who can move comfortably between frontend, backend, and product problems as the work demands
              - listitem [ref=f30e71]:
                - paragraph [ref=f30e72]: Work independently with good judgment about what matters, without needing constant direction
              - listitem [ref=f30e73]:
                - paragraph [ref=f30e74]: Communicate effectively and translate complex AI capabilities into intuitive experiences
              - listitem [ref=f30e75]:
                - paragraph [ref=f30e76]: Care about the societal impacts and ethics of your work
            - heading [level=3] [ref=f30e77]:
              - strong [ref=f30e78]: Strong candidates may also have
            - list [ref=f30e79]:
              - listitem [ref=f30e80]:
                - paragraph [ref=f30e81]: Extensive experience working with or building visual collaboration & creative tools (e.g., Figma, Canva, Adobe Creative Cloud, etc), and have strong opinions on how they could become more magical experiences
              - listitem [ref=f30e82]:
                - paragraph [ref=f30e83]: Hands-on experience with UI/UX for AI-powered applications, and fluency collaborating closely with designers
              - listitem [ref=f30e84]:
                - paragraph [ref=f30e85]: Background conducting user research, interviews, and usability testing
              - listitem [ref=f30e86]:
                - paragraph [ref=f30e87]: Deep frontend expertise in canvas rendering, complex editor UIs, design-system tooling, or graphics work (WebGL/shaders, 3D, animation)
              - listitem [ref=f30e88]:
                - paragraph [ref=f30e89]: Experience with real-time, collaborative applications (multiplayer editing, WebSockets) or complex, high-performance frontend interactions
            - heading [level=3] [ref=f30e90]:
              - strong [ref=f30e91]: Candidates need not have
            - list [ref=f30e92]:
              - listitem [ref=f30e93]:
                - paragraph [ref=f30e94]: 100% of the skills listed above
              - listitem [ref=f30e95]:
                - paragraph [ref=f30e96]: Formal certifications or education credentials
              - listitem [ref=f30e97]:
                - paragraph [ref=f30e98]: Direct machine learning or AI research experience
            - paragraph [ref=f30e99]
            - paragraph [ref=f30e100]:
              - strong [ref=f30e101]: "Deadline to apply:"
              - text: None. Applications will be reviewed on a rolling basis.
            - paragraph [ref=f30e102]: The annual compensation range for this role is listed below.
            - paragraph [ref=f30e103]
          - generic [ref=f30e105]:
            - generic [ref=f30e108]:
              - paragraph [ref=f30e109]: The annual compensation range for this role is listed below.
              - paragraph [ref=f30e110]: For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role.
            - paragraph [ref=f30e111]: "Annual Salary:"
            - paragraph [ref=f30e112]: $320,000 - $485,000 USD
          - generic [ref=f30e113]:
            - heading [level=2] [ref=f30e114]:
              - strong [ref=f30e115]: Logistics
            - paragraph [ref=f30e116]:
              - strong [ref=f30e117]: "Minimum education:"
              - text: Bachelor’s degree or an equivalent combination of education, training, and/or experience
            - paragraph [ref=f30e118]:
              - strong [ref=f30e119]: "Required field of study:"
              - text: A field relevant to the role as demonstrated through coursework, training, or professional experience
            - paragraph [ref=f30e120]:
              - strong [ref=f30e121]: "Minimum years of experience:"
              - text: Years of experience required will correlate with the internal job level requirements for the position
            - paragraph [ref=f30e122]:
              - strong [ref=f30e123]: "Location-based hybrid policy:"
              - text: Currently, we expect all staff to be in one of our offices at least 25% of the time. However, some roles may require more time in our offices.
            - paragraph [ref=f30e124]:
              - strong [ref=f30e125]: "Visa sponsorship:"
              - text: We do sponsor visas! However, we aren't able to successfully sponsor visas for every role and every candidate. But if we make you an offer, we will make every reasonable effort to get you a visa, and we retain an immigration lawyer to help with this.
            - paragraph [ref=f30e126]:
              - strong [ref=f30e127]: We encourage you to apply even if you do not believe you meet every single qualification.
              - text: Not all strong candidates will meet every single qualification as listed. Research shows that people who identify as being from underrepresented groups are more prone to experiencing imposter syndrome and doubting the strength of their candidacy, so we urge you not to exclude yourself prematurely and to submit an application if you're interested in this work. We think AI systems like the ones we're building have enormous social and ethical implications. We think this makes representation even more important, and we strive to include a range of diverse perspectives on our team.
              - strong [ref=f30e128]: Your safety matters to us.
              - text: To protect yourself from potential scams, remember that Anthropic recruiters only contact you from @anthropic.com email addresses. In some cases, we may partner with vetted recruiting agencies who will identify themselves as working on behalf of Anthropic. Be cautious of emails from other domains. Legitimate Anthropic recruiters will never ask for money, fees, or banking information before your first day. If you're ever unsure about a communication, don't click any links—visit
              - link "anthropic.com/careers" [ref=f30e130] [cursor=pointer]:
                - /url: http://anthropic.com/careers
              - text: directly for confirmed position openings.
            - heading [level=2] [ref=f30e131]:
              - strong [ref=f30e132]: How we're different
            - paragraph [ref=f30e133]: We believe that the highest-impact AI research will be big science. At Anthropic we work as a single cohesive team on just a few large-scale research efforts. And we value impact — advancing our long-term goals of steerable, trustworthy AI — rather than work on smaller and more specific puzzles. We view AI research as an empirical science, which has as much in common with physics and biology as with traditional efforts in computer science. We're an extremely collaborative group, and we host frequent research discussions to ensure that we are pursuing the highest-impact work at any given time. As such, we greatly value communication skills.
            - paragraph [ref=f30e134]: "The easiest way to understand our research directions is to read our recent research. This research continues many of the directions our team worked on prior to Anthropic, including: GPT-3, Circuit-Based Interpretability, Multimodal Neurons, Scaling Laws, AI & Compute, Concrete Problems in AI Safety, and Learning from Human Preferences."
            - heading [level=2] [ref=f30e135]:
              - strong [ref=f30e136]: Come work with us!
            - paragraph [ref=f30e137]:
              - text: Anthropic is a public benefit corporation headquartered in San Francisco. We offer competitive compensation and benefits, optional equity donation matching, generous vacation and parental leave, flexible working hours, and a lovely office space in which to collaborate with colleagues.
              - strong [ref=f30e138]: "Guidance on Candidates' AI Usage:"
              - text: Learn about
              - link "our policy" [ref=f30e139] [cursor=pointer]:
                - /url: https://www.anthropic.com/candidate-ai-guidance
              - text: for using AI in our application process.
