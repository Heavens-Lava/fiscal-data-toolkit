            - heading "What this role is not" [level=3] [ref=f37e123]
            - paragraph [ref=f37e124]: This is a hands-on technical role building product features, embedded within a research team. You'll provide technical guidance and help set direction, but this role doesn't involve people management off the bat. If you're looking to immediately transition into engineering management or lead a large team, this likely isn't the right fit.
            - paragraph [ref=f37e125]
          - generic [ref=f37e127]:
            - generic [ref=f37e130]:
