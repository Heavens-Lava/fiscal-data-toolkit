          - generic [ref=f37e21]:
            - heading [level=2] [ref=f37e22]:
              - strong [ref=f37e23]: About Anthropic
            - paragraph [ref=f37e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f37e25]:
            - heading [level=2] [ref=f37e26]:
              - strong [ref=f37e28]: About the role
            - paragraph [ref=f37e29]: We believe skill with AI is fundamental to human agency. Education Labs builds the paradigms that help people become genuinely more capable—not just more engaged.
            - paragraph [ref=f37e30]: "This is a new kind of role: part researcher, part product builder, part interaction designer. You'll be the second technical builder on a small team studying how AI transforms human capability—and shipping features based on what we discover. You'll have significant creative license to define what \"good\" looks like, exploring new interaction patterns rather than optimizing existing ones."
            - paragraph [ref=f37e31]: We're skeptical of tutorials, onboarding flows, and engagement metrics. We care about experiences that make users progressively more capable, curious, and empowered over time. This means integrating skill development into product design, using Claude itself as a capability-building partner, and measuring success by how users actually grow.
            - paragraph [ref=f37e32]: "You'll operate as a one-person technical shop: prototyping new ideas, establishing technical direction, and shipping production-quality features to millions of users. You'll need strong product instincts and clean interface design sensibilities, balanced with comfort in ambiguity and frontier thinking."
            - heading [level=2] [ref=f37e33]:
              - strong [ref=f37e35]: "Responsibilities:"
            - list [ref=f37e36]:
              - listitem [ref=f37e37]:
                - paragraph [ref=f37e38]: Ship features that help users develop real skill with AI—measuring success by capability growth, not time-on-site
              - listitem [ref=f37e39]:
                - paragraph [ref=f37e40]: "Architect end-to-end prototypes (front-end and back-end) that test new interaction paradigms, with particular attention to the front-of-the-frontend: motion, polish, and interaction feel"
              - listitem [ref=f37e41]:
                - paragraph [ref=f37e42]: Define technical direction for the team—establish patterns others can follow
              - listitem [ref=f37e43]:
                - paragraph [ref=f37e44]: Build relationships across Product, Design, and Research to influence how skill development principles shape Anthropic's broader product strategy
              - listitem [ref=f37e45]:
                - paragraph [ref=f37e46]: Shape team strategy and roadmap—identify the highest-leverage opportunities and build conviction across stakeholders
              - listitem [ref=f37e47]:
                - paragraph [ref=f37e48]: Translate research insights about skill development and human-AI collaboration into shipped product through close collaboration with researchers
              - listitem [ref=f37e49]:
                - paragraph [ref=f37e50]: Document and share your work through clear writing, prototypes, and presentations that influence thinking across the organization
            - heading [level=2] [ref=f37e51]:
              - strong [ref=f37e53]: "You may be a good fit if you have:"
            - paragraph [ref=f37e54]:
              - strong [ref=f37e55]: Strong full-stack engineering with design sensibility
            - list [ref=f37e56]:
              - listitem [ref=f37e57]:
                - paragraph [ref=f37e58]: 6+ years building and shipping web products, with deep expertise across the stack
              - listitem [ref=f37e59]:
                - paragraph [ref=f37e60]: "Strong front-end craft: TypeScript/JavaScript, React, CSS—with an eye for interaction design, motion, and visual detail"
              - listitem [ref=f37e61]:
                - paragraph [ref=f37e62]: "Solid back-end and data pipeline experience: Python, API design, analytics infrastructure"
              - listitem [ref=f37e63]:
                - paragraph [ref=f37e64]: A portfolio showcasing innovative interaction designs and high-quality implementations
              - listitem [ref=f37e65]:
                - paragraph [ref=f37e66]: Track record of independently driving features from prototype to production
            - paragraph [ref=f37e67]:
              - strong [ref=f37e68]: Deep conviction about human capability
            - list [ref=f37e69]:
              - listitem [ref=f37e70]:
                - paragraph [ref=f37e71]: Strong perspective on how technology should enhance human capabilities rather than diminish them
              - listitem [ref=f37e72]:
                - paragraph [ref=f37e73]: Experience or genuine passion for skill development, HCI, developer tools, or products that help people become more capable
              - listitem [ref=f37e74]:
                - paragraph [ref=f37e75]: Skepticism of purely engagement-driven metrics; interest in measuring capability outcomes
            - paragraph [ref=f37e76]:
              - strong [ref=f37e77]: Research mindset with product execution
            - list [ref=f37e78]:
              - listitem [ref=f37e79]:
                - paragraph [ref=f37e80]: Comfort with ambiguity and exploring undefined problem spaces
              - listitem [ref=f37e81]:
                - paragraph [ref=f37e82]: Ability to rapidly prototype, test with users, and iterate toward production
              - listitem [ref=f37e83]:
                - paragraph [ref=f37e84]: Strong instincts for product design and user experience, even without formal design training
            - paragraph [ref=f37e85]:
              - strong [ref=f37e86]: Strategic leadership and coalition building
            - list [ref=f37e87]:
              - listitem [ref=f37e88]:
                - paragraph [ref=f37e89]: Experience setting vision, shaping team strategy, and building conviction across cross-functional stakeholders
              - listitem [ref=f37e90]:
                - paragraph [ref=f37e91]: Ability to build productive relationships with Product, Design, Research, and Engineering teams—especially when your team isn't the owner
              - listitem [ref=f37e92]:
                - paragraph [ref=f37e93]: Strong sense of prioritization—knowing what to build now, what to defer, and what to cut
              - listitem [ref=f37e94]:
                - paragraph [ref=f37e95]: Track record of influencing roadmaps and decisions beyond your immediate team
            - heading [level=3] [ref=f37e96]
            - heading [level=2] [ref=f37e97]:
