              - listitem [ref=f37e103]:
                - paragraph [ref=f37e104]: Background in learning sciences, cognitive science, HCI, skill acquisition research, or educational psychology (formal or self-directed)
              - listitem [ref=f37e105]:
                - paragraph [ref=f37e106]: Experience with experimentation frameworks, A/B testing, or analytics that measure capability development in production
              - listitem [ref=f37e107]:
