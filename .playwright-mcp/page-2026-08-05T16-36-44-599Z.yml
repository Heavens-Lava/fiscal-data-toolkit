                  - generic [ref=f19e456]:
                    - text: Overview
                    - generic [ref=f19e458]: The Fabric Platform Shell team is dedicated to creating the best SaaS data development environment on the web. Our mission is to build a simple yet fully functional developer environment that attracts and retains developers, ensuring that more solutions are built on Fabric and more consumers use it. We aim to provide a unified and extensible web experience that is easy to understand and navigate, enabling 1st and 3rd party workloads to onboard seamlessly. The Fabric Platform Shell team is expanding to Vancouver, Canada.
                    - generic [ref=f19e459]: We focus on organizing our work around the core activities of big data project development, including data ingestion, storage, processing, and analysis. Our goal is to support the entire project development lifecycle, from item creation to production job scheduling and monitoring. By enhancing these processes, we aim to provide a best-in-class DevOps experience.
                    - generic [ref=f19e460]: This role offers a unique opportunity to work with the latest advancements in web UX development technologies, contributing to the creation of a comprehensive web studio experience. As a SaaS data analytics product, the web user experience is a critical component of our solution, enabling our customers to effectively manage and analyze their data. Your work will directly impact the usability and functionality of the platform, making it easier for users to navigate and utilize its features to their full potential.
                    - text: Responsibilities
                    - generic [ref=f19e461]: "As a Software Architect on the Fabric Platform Shell team, you will have the opportunity to work on cutting-edge technology and build world-class experiences for our customers. Your responsibilities will include:"
                    - list [ref=f19e462]:
                      - listitem [ref=f19e463]: Architecting and designing highly scalable experiences for the Fabric Platform in browser environments.
                      - listitem [ref=f19e464]: Working with engineering managers and developers on full stack and backend development to deliver comprehensive experiences based on the architecture.
                      - listitem [ref=f19e465]: Collaborating closely with UX & UI designers, product managers, program managers, and other engineers throughout the product feature development lifecycle.
                      - listitem [ref=f19e466]: Demonstrating technical leadership by identifying gaps and writing high-quality code.
                      - listitem [ref=f19e467]:
                        - text: Embody our
                        - link "culture" [ref=f19e468] [cursor=pointer]:
                          - /url: https://careers.microsoft.com/v2/global/en/culture
                        - text: and
                        - link "values" [ref=f19e469] [cursor=pointer]:
                          - /url: https://www.microsoft.com/en-us/about/corporate-values
                    - generic [ref=f19e470]: Coding
                    - list [ref=f19e471]:
                      - listitem [ref=f19e472]: Review and write code to meet team standards, ensure adequate test coverage, and maintain code quality. Use automated tools, debug proactively, and lead by example in producing secure, maintainable, and performant code. Apply and promote coding patterns and best practices across the team.
                    - generic [ref=f19e473]: Design
                    - list [ref=f19e474]:
                      - listitem [ref=f19e475]: Create and drive effective test strategies, ensure security testing, and improve the test suite. Build testable code, identify dependencies, collaborate across teams, and own architectural decisions to meet performance, security, and compliance requirements.
                    - generic [ref=f19e476]: Engineering Excellence
                    - list [ref=f19e477]:
                      - listitem [ref=f19e478]: Apply secure design principles, scale products to customer requirements, automate production and deployment, and ensure compliance with regulations. Stay current with technology trends, advocate best practices, and support development tools.
                    - generic [ref=f19e479]: Implement
                    - list [ref=f19e480]:
                      - listitem [ref=f19e481]: Drive project planning and estimation, ensure security and compliance in plans, automate deployments, and use experimentation to measure impact. Monitor dependencies and enact rollback plans when needed.
                    - generic [ref=f19e482]: Reliability and Supportability
                    - list [ref=f19e483]:
                      - listitem [ref=f19e484]: Integrate logging and telemetry for monitoring, act as a designated responsible individual (DRI), resolve incidents, maintain live site operations, and improve troubleshooting guides and support documentation.
                    - generic [ref=f19e485]: Understand User Requirements
                    - list [ref=f19e486]:
                      - listitem [ref=f19e487]: Collaborate with stakeholders to confirm user requirements, incorporate customer feedback into product improvements, and advocate for user security and privacy needs.
                    - text: Qualifications
                    - strong [ref=f19e494]: Required/minimum qualifications
                    - list [ref=f19e496]:
                      - listitem [ref=f19e497]: Bachelor's Degree in Computer Science or related technical field AND 4+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python OR equivalent experience.
                      - listitem [ref=f19e498]: 2+ years demonstrated expertise in web application development, including JavaScript, TypeScript, HTML, CSS, and at least one popular web frontend framework such as React, Vue, or Angular
                    - strong [ref=f19e500]: "Additional Job Requirements:"
                    - list [ref=f19e501]:
                      - listitem [ref=f19e502]: "Ability to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include, but are not limited to the following specialized security screenings: Microsoft Cloud Background Check:"
                      - listitem [ref=f19e503]: This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter.
                      - listitem [ref=f19e504]
                    - strong [ref=f19e506]: "Preferred/Additional Qualifications:"
                    - list [ref=f19e507]:
                      - listitem [ref=f19e508]: 3+ years demonstrated expertise in developing complex web application and front-end architectures on technology including JavaScript, TypeScript, HTML, CSS, and at least one popular web frontend framework such as React, Vue, or Angular.
                      - listitem [ref=f19e509]: Bachelor's Degree in Computer Science or related technical field AND 8+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python
                      - listitem [ref=f19e510]: OR Master's Degree in Computer Science or related technical field AND 6+ years technical engineering experience with coding in languages including, but not limited to, C, C++, C#, Java, JavaScript, or Python +
                      - listitem [ref=f19e511]: OR equivalent experience.
                      - listitem [ref=f19e512]: A passion for delivering modern, high-performance user experiences in browser environments.
                      - listitem [ref=f19e513]: Experience in building great developer and user experiences for modern analytics systems.
                      - listitem [ref=f19e514]: A deep curiosity and willingness to question the status quo.
                      - listitem [ref=f19e515]: High enthusiasm, integrity, ingenuity, results-orientation, and self-motivation in a fast-paced environment.
                      - listitem [ref=f19e516]: A love for tackling the next problem, the next experiment, and the next partnership.
                      - listitem [ref=f19e517]: Committed to work collaboratively, solve problems with teams across the world, and find win/win solutions.
                      - listitem [ref=f19e518]: A deep passion and empathy for customers, leading to innovative problem-solving.
                    - generic [ref=f19e519]: Join us in our mission to revolutionize the SaaS data development environment and make a significant impact on the Fabric Platform. We look forward to seeing how your enthusiasm and expertise can contribute to our team's success.
                    - generic [ref=f19e520]: "#AzureData #AzDat #Fabric"
